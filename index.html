<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invoice Tracker</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#22201c;--mute:#7a746a;--line:#e6e0d5;--accent:#d9481c;--ok:#2f7d4f;--warn:#b7791f;--bad:#c0322b;--okbg:#e5f3ea;--warnbg:#fbf0d9;--badbg:#fbe4e2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161513;--card:#211f1c;--ink:#f0ebe2;--mute:#9d968a;--line:#35322c;--accent:#ff7043;--ok:#6cc48f;--warn:#e8b24f;--bad:#ff8a80;--okbg:#1f3327;--warnbg:#3a2f18;--badbg:#3d2321}}
:root[data-theme="dark"]{--bg:#161513;--card:#211f1c;--ink:#f0ebe2;--mute:#9d968a;--line:#35322c;--accent:#ff7043;--ok:#6cc48f;--warn:#e8b24f;--bad:#ff8a80;--okbg:#1f3327;--warnbg:#3a2f18;--badbg:#3d2321}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Helvetica Neue",Arial,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:30px;margin:0 0 4px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat small{color:var(--mute);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:Georgia,serif;font-size:26px}
.stat.bad b{color:var(--bad)}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px;align-items:end}
label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:10px}
button:hover{filter:brightness(.96)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.group>header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.group h2{margin:0;font-size:17px}
.group header span{color:var(--mute);font-size:14px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row .amt{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.meta{color:var(--mute);font-size:13px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}
.acts{grid-column:1/-1;display:flex;gap:8px}
.acts button{padding:5px 10px;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:40px 10px;border:1px dashed var(--line);border-radius:12px}
.foot{color:var(--mute);font-size:12px;margin-top:20px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Invoice Tracker</h1>
  <p class="sub">Who owes you what, and how late it is.</p>

  <section class="stats" id="stats"></section>

  <form id="f">
    <label>Client<input id="client" list="clients" required placeholder="Studio Nord"></label>
    <label>Invoice #<input id="num" placeholder="2026-014"></label>
    <label>Amount (€)<input id="amount" type="number" min="0" step="0.01" required></label>
    <label>Issued<input id="issued" type="date" required></label>
    <label>Due<input id="due" type="date" required></label>
    <button class="primary" type="submit">Add invoice</button>
    <datalist id="clients"></datalist>
  </form>

  <div class="bar" id="bar"></div>
  <div id="list"></div>
  <p class="foot" id="foot"></p>
</main>

<script>
(function(){
  var items=[], filter='open', store=null, saveTimer=null, LS='invoice-tracker-v1';
  var $=function(id){return document.getElementById(id)};
  var eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
  var today=function(){var d=new Date();d.setHours(0,0,0,0);return d};
  var iso=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  var parse=function(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])};
  var fmtDate=function(s){return parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})};
  var daysLate=function(i){return Math.round((today()-parse(i.due))/864e5)};
  var esc=function(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML};
  var sum=function(a){return a.reduce(function(t,i){return t+i.amount},0)};

  $('issued').value=iso(today());
  var d30=today();d30.setDate(d30.getDate()+30);$('due').value=iso(d30);
  $('issued').addEventListener('change',function(){if(!this.value)return;var d=parse(this.value);d.setDate(d.getDate()+30);$('due').value=iso(d)});

  function persist(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(async function(){
      try{
        if(store){await store.set({items:items})}
        else{localStorage.setItem(LS,JSON.stringify(items))}
      }catch(e){$('foot').textContent='Could not save – changes may be lost on reload.'}
    },250);
  }
  async function load(){
    try{
      if(window.claude&&claude.use){
        var db=await claude.use('db'), user=await claude.use('user');
        if(db&&user){
          var uid=await user.id();
          if(uid){
            store=db.collection('data/users/'+uid).doc('invoices');
            var snap=await store.get();
            if(snap.exists){items=(snap.data().items)||[]}
            $('foot').textContent='Saved privately to your Claude account.';
            return;
          }
        }
      }
    }catch(e){store=null}
    try{items=JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){items=[]}
    $('foot').textContent='Saved in this browser only.';
  }

  function badge(i){
    if(i.paidOn)return '<span class="badge b-ok">Paid '+fmtDate(i.paidOn)+'</span>';
    var l=daysLate(i);
    if(l>0)return '<span class="badge b-bad">'+l+' day'+(l>1?'s':'')+' overdue</span>';
    if(l===0)return '<span class="badge b-warn">Due today</span>';
    return '<span class="badge b-warn">Due in '+(-l)+' day'+(l<-1?'s':'')+'</span>';
  }
  function render(){
    var open=items.filter(function(i){return !i.paidOn});
    var over=open.filter(function(i){return daysLate(i)>0});
    $('stats').innerHTML=
      '<div class="stat"><small>Outstanding</small><b>'+eur.format(sum(open))+'</b></div>'+
      '<div class="stat bad"><small>Overdue</small><b>'+eur.format(sum(over))+'</b></div>'+
      '<div class="stat"><small>Unpaid invoices</small><b>'+open.length+'</b></div>';
    var names=Array.from(new Set(items.map(function(i){return i.client}))).sort();
    $('clients').innerHTML=names.map(function(n){return '<option value="'+esc(n)+'">'}).join('');

    var tabs=[['open','Unpaid'],['overdue','Overdue'],['paid','Paid'],['all','All']];
    $('bar').innerHTML=tabs.map(function(t){return '<button data-f="'+t[0]+'" class="'+(filter===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('');

    var shown=items.filter(function(i){
      return filter==='all'||(filter==='open'&&!i.paidOn)||(filter==='paid'&&i.paidOn)||(filter==='overdue'&&!i.paidOn&&daysLate(i)>0)});
    if(!shown.length){$('list').innerHTML='<div class="empty">'+(items.length?'Nothing here – nice.':'No invoices yet. Add your first one above.')+'</div>';return}

    var by={};shown.forEach(function(i){(by[i.client]=by[i.client]||[]).push(i)});
    var owedOf=function(c){return sum(by[c].filter(function(i){return !i.paidOn}))};
    var clients=Object.keys(by).sort(function(a,b){return owedOf(b)-owedOf(a)});
    $('list').innerHTML=clients.map(function(c){
      var rows=by[c].sort(function(a,b){return a.due<b.due?-1:1});
      var owed=owedOf(c);
      return '<section class="group"><header><h2>'+esc(c)+'</h2><span>'+(owed?eur.format(owed)+' owed':'all paid')+'</span></header>'+
        rows.map(function(i){
          return '<div class="row"><div><b>'+(esc(i.num)||'No number')+'</b>'+badge(i)+
            '<div class="meta">Issued '+fmtDate(i.issued)+' · due '+fmtDate(i.due)+'</div></div>'+
            '<div class="amt">'+eur.format(i.amount)+'</div>'+
            '<div class="acts"><button data-paid="'+i.id+'">'+(i.paidOn?'Mark unpaid':'Mark paid')+'</button>'+
            '<button data-del="'+i.id+'">Delete</button></div></div>'}).join('')+'</section>';
    }).join('');
  }

  $('f').addEventListener('submit',function(e){
    e.preventDefault();
    items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      client:$('client').value.trim(),num:$('num').value.trim(),amount:parseFloat($('amount').value)||0,
      issued:$('issued').value,due:$('due').value,paidOn:null});
    $('client').value='';$('num').value='';$('amount').value='';
    persist();render();$('client').focus();
  });
  document.addEventListener('click',function(e){
    var t=e.target;
    if(t.dataset.f){filter=t.dataset.f;render()}
    if(t.dataset.paid){items.forEach(function(i){if(i.id===t.dataset.paid)i.paidOn=i.paidOn?null:iso(today())});persist();render()}
    if(t.dataset.del&&confirm('Delete this invoice?')){items=items.filter(function(i){return i.id!==t.dataset.del});persist();render()}
  });

  render();
  load().then(render);
})();
</script>
</body>
</html>
